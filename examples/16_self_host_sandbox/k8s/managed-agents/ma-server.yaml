apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: managed-agents-ma-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ebs-ssd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ma-server
spec:
  selector:
    app.kubernetes.io/name: managed-agents-ma-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: managed-agents-ma-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: managed-agents-ma-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: managed-agents-ma-server
        app.kubernetes.io/part-of: managed-agents-demo
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: cr-zn-datapath-cn-beijing
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ma-server
          image: zn-datapath-cn-beijing.cr.volces.com/sandbox/ma-server:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: managed-agents-config
            - secretRef:
                name: managed-agents-task-auth
            - secretRef:
                name: managed-agents-ma-auth
            - secretRef:
                name: managed-agents-agentkit-auth
          env:
            - name: MA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: managed-agents-postgres-auth
                  key: MA_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: managed-agents-ma-data
        - name: tmp
          emptyDir: {}
