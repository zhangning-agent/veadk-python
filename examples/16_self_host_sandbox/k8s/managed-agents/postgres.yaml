apiVersion: v1
kind: Service
metadata:
  name: managed-agents-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: managed-agents-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: managed-agents-postgres
spec:
  serviceName: managed-agents-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: managed-agents-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: managed-agents-postgres
        app.kubernetes.io/part-of: managed-agents-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: zn-datapath-cn-beijing.cr.volces.com/sandbox/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: managed-agents-config
                  key: DATABASE_POSTGRESQL_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: managed-agents-config
                  key: DATABASE_POSTGRESQL_DATABASE
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: managed-agents-postgres-auth
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-ssd
        resources:
          requests:
            storage: 10Gi
