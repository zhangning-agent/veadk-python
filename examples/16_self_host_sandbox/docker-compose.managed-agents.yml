services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veadk
      POSTGRES_PASSWORD: veadk
      POSTGRES_DB: veadk
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veadk -d veadk"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - managed_agents_postgres:/var/lib/postgresql/data

  ma-server:
    build:
      context: ../../../agent-ma/ma-server
    environment:
      TASK_SERVER_BASE_URL: ${TASK_SERVER_BASE_URL:?set TASK_SERVER_BASE_URL}
      TASK_SERVER_API_KEY: ${TASK_SERVER_API_KEY:?set TASK_SERVER_API_KEY}
      TASK_SERVER_ACCOUNT_ID: ${TASK_SERVER_ACCOUNT_ID:-}
      ANTHROPIC_ENVIRONMENT_ID: ${ANTHROPIC_ENVIRONMENT_ID:?set ANTHROPIC_ENVIRONMENT_ID}
      ANTHROPIC_ENVIRONMENT_KEY: ${ANTHROPIC_ENVIRONMENT_KEY:?set ANTHROPIC_ENVIRONMENT_KEY}
      MA_SERVER_API_TOKEN: ${MA_SERVER_API_TOKEN:?set MA_SERVER_API_TOKEN}
      APP_AGENT_STORE_PATH: /data/agents.json
      APP_ENVIRONMENT_STORE_PATH: /data/environments.json
      APP_SESSION_STORE_PATH: /data/sessions.json
      ENVIRONMENT_WORK_STORE_PATH: /data/environment-work.sqlite3
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,ma-server,postgres}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - managed_agents_agents:/data
    ports:
      - "127.0.0.1:${MA_SERVER_PORT:-18081}:8000"

  gateway:
    image: nginx:1.27-alpine
    environment:
      NGINX_ENVSUBST_FILTER: ^(TASK_SERVER_BASE_URL|ANTHROPIC_ENVIRONMENT_KEY|X_TOP_ACCOUNT_ID|MA_SERVER_API_TOKEN)$$
      TASK_SERVER_BASE_URL: ${TASK_SERVER_BASE_URL:?set TASK_SERVER_BASE_URL}
      ANTHROPIC_ENVIRONMENT_KEY: ${ANTHROPIC_ENVIRONMENT_KEY:?set ANTHROPIC_ENVIRONMENT_KEY}
      X_TOP_ACCOUNT_ID: ${TASK_SERVER_ACCOUNT_ID:-}
      MA_SERVER_API_TOKEN: ${MA_SERVER_API_TOKEN:?set MA_SERVER_API_TOKEN}
    depends_on:
      ma-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MANAGED_AGENTS_GATEWAY_PORT:-18080}:8080"
    volumes:
      - ./nginx.managed-agents.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "task-server:host-gateway"

volumes:
  managed_agents_postgres:
  managed_agents_agents:
